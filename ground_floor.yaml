# Configuration for the Quinled an-penta-deca for the ground floor.
# Documentation:
# https://quinled.info/quinled-an-penta-deca-pinout-guide/
# https://esphome.io/components/light/
#
# Behaviour:
#   Each button controls one monochromatic LED channel.
#
#   Short press (< MAX_CLICK_DURATION):
#     - Toggles the light ON/OFF.
#     - When turning ON, brightness is restored to the previous value.
#     - If restored brightness is below the minimum threshold (MIN_BRIGHTNESS),
#       it is clamped up to that minimum.
#     - After toggling, the dim direction is set based on brightness:
#       <= 50% → next dim will go UP, > 50% → next dim will go DOWN.
#
#   Long press (>= MAX_CLICK_DURATION, while light is ON):
#     - Starts a smooth brightness transition toward the target
#       (100% if direction is UP, minimum if DOWN).
#     - Dimming speed is constant: the transition duration is proportional
#       to the brightness distance, so a full sweep always takes
#       DEFAULT_DIM_DURATION seconds regardless of starting point.
#     - On release, brightness freezes at the current level and the
#       dim direction flips for the next long press.
#
#   Long press while light is OFF:
#     - Light turns on when button is released
#
#   Max Brightness (Night Mode):
#     - A global max brightness slider is exposed to Home Assistant.
#     - Uses output.set_max_power to cap PWM at hardware level — cannot be
#       bypassed by HA or any other brightness command.
#     - Set via HA automation (e.g., 40% after 22:00, 100% at sunrise).
#     - Value survives reboots.
#
#   Adding a new light + button:
#     1. Add an output, light, and binary_sensor entry.
#     2. Register them in the on_boot lambda (light_registry / button_registry).
#     3. Add a set_dim_direction_from_brightness call in on_boot.
#     4. Wire the button's on_press → start_dimming, on_release → stop_dimming_or_toggle.


substitutions:
  ESPHOME_NAME: an-penta-deca-ground-floor
  MIN_BRIGHTNESS: 12          # Minimum brightness threshold (in %)
  DEFAULT_DIM_DURATION: 4       # Duration of full-range dimming transition (seconds, used in lambdas as *1000) - this needs to be an integer for lambda usage
                                # Duration is then rescaled based on this and the actual range
  DEFAULT_ONOFF_DURATION: 400ms # Duration of on/off transition
  IMMEDIATE_TRANSITION: 0       # Duration of immediate transition - this needs to be an integer for lambda usage
  MAX_CLICK_DURATION: 400ms     # Maximum click duration
  BUTTON_FILTER_DURATION: 50ms  # Button filter duration
  PWM_FREQUENCY: 19531Hz
  GAMMA_CORRECTION: 2.8
  LOG_LEVEL: DEBUG              # NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE

# ========================================
# Core Configuration
# ========================================
esphome:
  name: ${ESPHOME_NAME}
  on_boot:
    priority: -100  # Run after lights are restored
    then:
      # NOTE: When adding a new light or button, register it here and
      #       add a set_dim_direction_from_brightness call below.
      - lambda: |-
          id(light_registry)["led_1"] = id(led_1);
          id(light_registry)["led_2"] = id(led_2);
          id(button_registry)["button_1"] = id(button_1);
          id(button_registry)["pcf8574_button_0"] = id(pcf8574_button_0);
      - delay: 1s  # Wait for light state to fully restore
      # Apply restored max_brightness to outputs
      - lambda: |-
          float cap = id(max_brightness).state / 100.0f;
          id(LED_CHANNEL_1).set_max_power(cap);
          id(LED_CHANNEL_2).set_max_power(cap);
          ESP_LOGI("max_brightness", "Boot: max_brightness restored to %.0f%% (max_power=%.2f)", id(max_brightness).state, cap);
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: led_1
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: led_2

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ========================================
# Network Configuration
# ========================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .domain.local
  ap:
    ssid: "Test-An-Penta-Deca"
    password: "Cz6pyMLrL50A"

captive_portal:

web_server:
  port: 80

api:
  reboot_timeout: 60min
  encryption:
    key: "R+8A1JK4uNrr11N6KMmKRQYDR8T7bvLyUt930s/TlJI="

ota:
  - platform: esphome
    password: "74c3e4d1c89a84a26ac14d56e664c676"

# ========================================
# Peripherals
# ========================================
logger:
  level: ${LOG_LEVEL}

i2c:
  sda: 15
  scl: 16
  scan: true

pcf8574:
  - id: pcf8574_hub
    address: 0x20

time:
  - platform: homeassistant
    id: homeassistant_time

# ========================================
# Global Variables
# ========================================
globals:
  - id: dim_direction
    type: std::map<std::string, bool>
    restore_value: false
    # Per-light dim direction: true = UP, false = DOWN
  - id: is_dimming
    type: std::map<std::string, bool>
    restore_value: false
    # Per-light dimming state: defaults to false via operator[]
  - id: light_registry
    type: std::map<std::string, esphome::light::LightState *>
    restore_value: false
  - id: button_registry
    type: std::map<std::string, esphome::binary_sensor::BinarySensor *>
    restore_value: false

# ========================================
# Scripts (Reusable Actions)
# ========================================
script:
  - id: log_debug_state
    mode: parallel
    parameters:
      context: string
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light) {
            ESP_LOGD("debug", "[DEBUG %s] [%s] is_dimming: %s; dim_direction: %s; is_on: %s; brightness: %f",
              context.c_str(),
              light_id.c_str(),
              id(is_dimming)[light_id] ? "YES" : "NO",
              id(dim_direction)[light_id] ? "UP" : "DOWN",
              light->remote_values.is_on() ? "YES" : "NO",
              light->remote_values.get_brightness());
          }

  - id: ensure_min_brightness
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light && light->remote_values.is_on() &&
              light->remote_values.get_brightness() < (${MIN_BRIGHTNESS} / 100.0f)) {
            auto call = light->turn_on();
            call.set_brightness(${MIN_BRIGHTNESS} / 100.0f);
            call.perform();
          }

  - id: set_dim_direction_from_brightness
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light && light->remote_values.is_on()) {
            id(dim_direction)[light_id] = light->remote_values.get_brightness() <= 0.5;
          } else {
            id(dim_direction)[light_id] = true;  // default to UP when off
          }

  - id: toggle_light
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light) {
            light->toggle().perform();
          }
      - script.execute:
          id: log_debug_state
          context: "CLICK"
          light_id: !lambda 'return light_id;'
      - script.execute:
          id: ensure_min_brightness
          light_id: !lambda 'return light_id;'
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: !lambda 'return light_id;'

  # Long press: Start dimming
  - id: start_dimming
    mode: parallel # If you are having problems with long press detection, try changing this to queued
    parameters:
      light_id: string
      button_id: string
    then:
      - delay: ${MAX_CLICK_DURATION}
      - lambda: |-
          auto *btn = id(button_registry)[button_id];
          auto *light = id(light_registry)[light_id];
          if (btn && btn->state && light && light->remote_values.is_on() && !id(is_dimming)[light_id]) {
            id(is_dimming)[light_id] = true;
            float current = light->remote_values.get_brightness();
            float max_br = id(max_brightness).state / 100.0f;
            float target = id(dim_direction)[light_id] ? max_br : (${MIN_BRIGHTNESS} / 100.0f);
            float distance = fabs(target - current);
            float full_range = max_br - (${MIN_BRIGHTNESS} / 100.0f);
            uint32_t transition_ms = (uint32_t)(${DEFAULT_DIM_DURATION} * 1000.0f * distance / full_range);
            auto call = light->turn_on();
            call.set_brightness(target);
            call.set_transition_length(transition_ms);
            call.perform();
          }
      - script.execute:
          id: log_debug_state
          context: "PRESS"
          light_id: !lambda 'return light_id;'

  # Release: Stop dimming (long press) or toggle (short press)
  - id: stop_dimming_or_toggle
    mode: parallel
    parameters:
      light_id: string
    then:
      - if:
          condition:
            lambda: 'return id(is_dimming)[light_id];'
          then:
            # Long press release: freeze brightness and flip direction
            - lambda: |-
                auto *light = id(light_registry)[light_id];
                if (light) {
                  auto call = light->turn_on();
                  call.set_brightness(light->current_values.get_brightness());
                  call.set_transition_length(${IMMEDIATE_TRANSITION});
                  call.perform();
                  id(dim_direction)[light_id] = !id(dim_direction)[light_id];
                  id(is_dimming)[light_id] = false;
                }
            - script.execute:
                id: log_debug_state
                context: " LONG PRESS RELEASE"
                light_id: !lambda 'return light_id;'
          else:
            # Short press release: toggle light
            - script.execute:
                id: toggle_light
                light_id: !lambda 'return light_id;'

# ========================================
# Outputs & Lights
# ========================================
output:
  - platform: ledc
    pin: 27
    frequency: ${PWM_FREQUENCY}
    id: LED_CHANNEL_1
    zero_means_zero: true
  - platform: ledc
    pin: 26
    frequency: ${PWM_FREQUENCY}
    id: LED_CHANNEL_2
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "${ESPHOME_NAME}-L1"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_1
    output: LED_CHANNEL_1
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: monochromatic
    name: "${ESPHOME_NAME}-L2"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_2
    output: LED_CHANNEL_2
    restore_mode: RESTORE_DEFAULT_OFF

# ========================================
# Sensors
# ========================================
sensor:
  - platform: uptime
    name: "${ESPHOME_NAME}_Uptime Sensor"
  - platform: internal_temperature
    name: "${ESPHOME_NAME} Internal Temp"
    unit_of_measurement: "°C"
  - platform: wifi_signal
    name: "${ESPHOME_NAME} WiFi Signal"
    update_interval: 60s

switch:
  - platform: restart
    name: ${ESPHOME_NAME}-restart
    id: restart_switch

# ========================================
# Max Brightness Control (Night Mode)
# ========================================
number:
  - platform: template
    name: "${ESPHOME_NAME} Max Brightness"
    id: max_brightness
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    min_value: ${MIN_BRIGHTNESS}
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          ESP_LOGI("max_brightness", "Max brightness changed to %.0f%%", x);
      # Set max_power on all outputs — caps PWM duty at hardware level
      - output.set_max_power:
          id: LED_CHANNEL_1
          max_power: !lambda 'return x / 100.0f;'
      - output.set_max_power:
          id: LED_CHANNEL_2
          max_power: !lambda 'return x / 100.0f;'
      # Re-apply current brightness so the new max_power takes effect immediately
      - lambda: |-
          for (auto &pair : id(light_registry)) {
            auto *light = pair.second;
            if (light && light->remote_values.is_on()) {
              auto call = light->turn_on();
              call.set_brightness(light->remote_values.get_brightness());
              call.set_transition_length(${IMMEDIATE_TRANSITION});
              call.perform();
            }
          }

# ========================================
# Binary Sensors (Buttons)
# ========================================
binary_sensor:

  # =========================
  # LED 2 - EXTERNAL BUTTON 0
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 0
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P0"
    id: pcf8574_button_0
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_2
            button_id: pcf8574_button_0

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_2

  # =========================
  # LED 1 - INTERNAL BUTTON 1
  # =========================
  - platform: gpio
    pin: 36
    name: "Button 1"
    id: button_1
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_1
            button_id: button_1

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_1
