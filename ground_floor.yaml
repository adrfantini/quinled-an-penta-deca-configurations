substitutions:
  ESPHOME_NAME: test-an-penta-deca
  MIN_BRIGHTNESS: 0.12          # Minimum brightness threshold (12%)
  DEFAULT_DIM_DURATION: 4       # Duration of full-range dimming transition (seconds, used in lambdas as *1000) - this needs to be an integer for lambda usage
                                # Duration is then rescaled based on this and the actual range
  DEFAULT_ONOFF_DURATION: 400ms # Duration of on/off transition
  IMMEDIATE_TRANSITION: 0       # Duration of immediate transition - this needs to be an integer for lambda usage
  MAX_CLICK_DURATION: 400ms     # Maximum click duration
  BUTTON_FILTER_DURATION: 50ms  # Button filter duration
  PWM_FREQUENCY: 19531Hz
  GAMMA_CORRECTION: 2.8

# ========================================
# Core Configuration
# ========================================
esphome:
  name: ${ESPHOME_NAME}
  on_boot:
    priority: -100  # Run after lights are restored
    then:
      # NOTE: When adding a new light or button, register it here and
      #       add a set_dim_direction_from_brightness call below.
      - lambda: |-
          id(light_registry)["led_1"] = id(led_1);
          id(light_registry)["led_2"] = id(led_2);
          id(button_registry)["button_1"] = id(button_1);
          id(button_registry)["pcf8574_button_0"] = id(pcf8574_button_0);
      - delay: 1s  # Wait for light state to fully restore
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: led_1
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: led_2

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ========================================
# Network Configuration
# ========================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .domain.local
  ap:
    ssid: "Test-An-Penta-Deca"
    password: "Cz6pyMLrL50A"

captive_portal:

web_server:
  port: 80

api:
  reboot_timeout: 60min
  encryption:
    key: "R+8A1JK4uNrr11N6KMmKRQYDR8T7bvLyUt930s/TlJI="

ota:
  - platform: esphome
    password: "74c3e4d1c89a84a26ac14d56e664c676"

# ========================================
# Peripherals
# ========================================
logger:

i2c:
  sda: 15
  scl: 16
  scan: true

pcf8574:
  - id: pcf8574_hub
    address: 0x20

time:
  - platform: homeassistant
    id: homeassistant_time

# ========================================
# Global Variables
# ========================================
globals:
  - id: dim_direction
    type: std::map<std::string, bool>
    restore_value: false
    # Per-light dim direction: true = UP, false = DOWN
  - id: is_dimming
    type: std::map<std::string, bool>
    restore_value: false
    # Per-light dimming state: defaults to false via operator[]
  - id: light_registry
    type: std::map<std::string, esphome::light::LightState *>
    restore_value: false
  - id: button_registry
    type: std::map<std::string, esphome::binary_sensor::BinarySensor *>
    restore_value: false

# ========================================
# Scripts (Reusable Actions)
# ========================================
script:
  - id: log_debug_state
    mode: parallel
    parameters:
      context: string
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light) {
            ESP_LOGD("debug", "[DEBUG %s] [%s] is_dimming: %s; dim_direction: %s; is_on: %s; brightness: %f",
              context.c_str(),
              light_id.c_str(),
              id(is_dimming)[light_id] ? "YES" : "NO",
              id(dim_direction)[light_id] ? "UP" : "DOWN",
              light->remote_values.is_on() ? "YES" : "NO",
              light->remote_values.get_brightness());
          }

  - id: ensure_min_brightness
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light && light->remote_values.is_on() &&
              light->remote_values.get_brightness() < ${MIN_BRIGHTNESS}) {
            auto call = light->turn_on();
            call.set_brightness(${MIN_BRIGHTNESS});
            call.perform();
          }

  - id: set_dim_direction_from_brightness
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light && light->remote_values.is_on()) {
            id(dim_direction)[light_id] = light->remote_values.get_brightness() <= 0.5;
          } else {
            id(dim_direction)[light_id] = true;  // default to UP when off
          }

  - id: toggle_light
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light) {
            light->toggle().perform();
          }
      - script.execute:
          id: log_debug_state
          context: "CLICK"
          light_id: !lambda 'return light_id;'
      - script.execute:
          id: ensure_min_brightness
          light_id: !lambda 'return light_id;'
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: !lambda 'return light_id;'

  - id: start_dimming
    mode: parallel
    parameters:
      light_id: string
      button_id: string
    then:
      - delay: ${MAX_CLICK_DURATION}
      - lambda: |-
          auto *btn = id(button_registry)[button_id];
          auto *light = id(light_registry)[light_id];
          if (btn && btn->state && light && light->remote_values.is_on()) {
            id(is_dimming)[light_id] = true;
            float current = light->remote_values.get_brightness();
            float target = id(dim_direction)[light_id] ? 1.0f : ${MIN_BRIGHTNESS}f;
            float distance = fabs(target - current);
            float full_range = 1.0f - ${MIN_BRIGHTNESS}f;
            uint32_t transition_ms = (uint32_t)(${DEFAULT_DIM_DURATION} * 1000.0f * distance / full_range);
            auto call = light->turn_on();
            call.set_brightness(target);
            call.set_transition_length(transition_ms);
            call.perform();
          }
      - script.execute:
          id: log_debug_state
          context: "PRESS"
          light_id: !lambda 'return light_id;'

  - id: stop_dimming_or_toggle
    mode: parallel
    parameters:
      light_id: string
    then:
      - if:
          condition:
            lambda: 'return id(is_dimming)[light_id];'
          then:
            # Long press release: freeze brightness and flip direction
            - lambda: |-
                auto *light = id(light_registry)[light_id];
                if (light) {
                  auto call = light->turn_on();
                  call.set_brightness(light->current_values.get_brightness());
                  call.set_transition_length(${IMMEDIATE_TRANSITION});
                  call.perform();
                  id(dim_direction)[light_id] = !id(dim_direction)[light_id];
                  id(is_dimming)[light_id] = false;
                }
            - script.execute:
                id: log_debug_state
                context: " LONG PRESS RELEASE"
                light_id: !lambda 'return light_id;'
          else:
            # Short press release: toggle light
            - script.execute:
                id: toggle_light
                light_id: !lambda 'return light_id;'

# ========================================
# Outputs & Lights
# ========================================
output:
  - platform: ledc
    pin: 27
    frequency: ${PWM_FREQUENCY}
    id: LED_CHANNEL_1
    zero_means_zero: true
  - platform: ledc
    pin: 26
    frequency: ${PWM_FREQUENCY}
    id: LED_CHANNEL_2
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "${ESPHOME_NAME}-L1"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_1
    output: LED_CHANNEL_1
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: monochromatic
    name: "${ESPHOME_NAME}-L2"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_2
    output: LED_CHANNEL_2
    restore_mode: RESTORE_DEFAULT_OFF

# ========================================
# Sensors
# ========================================
sensor:
  - platform: uptime
    name: "${ESPHOME_NAME}_Uptime Sensor"
  - platform: internal_temperature
    name: "${ESPHOME_NAME} Internal Temp"
    unit_of_measurement: "°C"
  - platform: wifi_signal
    name: "${ESPHOME_NAME} WiFi Signal"
    update_interval: 60s

switch:
  - platform: restart
    name: ${ESPHOME_NAME}-restart
    id: restart_switch

# ========================================
# Binary Sensors (Buttons)
# ========================================
binary_sensor:
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 0
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P0"
    id: pcf8574_button_0
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    # Long press: Start dimming
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_2
            button_id: pcf8574_button_0

    # Release: Stop dimming (long press) or toggle (short press)
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_2

  - platform: gpio
    pin: 36
    name: "Button 1"
    id: button_1
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    # Long press: Start dimming
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_1
            button_id: button_1

    # Release: Stop dimming (long press) or toggle (short press)
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_1
