substitutions:
  ESPHOME_NAME: test-an-penta-deca
  MIN_BRIGHTNESS: 0.12          # Minimum brightness threshold (12%)
  DEFAULT_DIM_DURATION: 3s      # Duration of dimming transition
  DEFAULT_ONOFF_DURATION: 400ms # Duration of on/off transition
  IMMEDIATE_TRANSITION: 0s      # Duration of immediate transition
  MAX_CLICK_DURATION: 400ms     # Maximum click duration
  MIN_CLICK_DURATION: 50ms      # Minimum click duration
  BUTTON_FILTER_DURATION: 50ms  # Button filter duration
  PWM_FREQUENCY: 19531Hz

# ========================================
# Core Configuration
# ========================================
esphome:
  name: ${ESPHOME_NAME}
  on_boot:
    priority: -100  # Run after lights are restored
    then:
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: LED_1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ========================================
# Network Configuration
# ========================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .domain.local
  ap:
    ssid: "Test-An-Penta-Deca"
    password: "Cz6pyMLrL50A"

web_server:
  port: 80

api:
  reboot_timeout: 60min
  encryption:
    key: "R+8A1JK4uNrr11N6KMmKRQYDR8T7bvLyUt930s/TlJI="

ota:
  - platform: esphome
    password: "74c3e4d1c89a84a26ac14d56e664c676"

# ========================================
# Peripherals
# ========================================
logger:

i2c:
  sda: 15
  scl: 16
  scan: true

time:
  - platform: homeassistant
    id: homeassistant_time

# ========================================
# Global Variables
# ========================================
globals:
  - id: dim_direction
    type: std::map<std::string, bool>
    restore_value: false # restore_value isn't supported for map types
    # Per-light dim direction: true = UP, false = DOWN
    # Defaults to UP (true) for unknown keys via operator[]
  - id: is_dimming
    type: std::map<std::string, bool>
    restore_value: false # restore_value isn't supported for map types
    # Per-light dimming state: defaults to false via operator[]

# ========================================
# Scripts (Reusable Actions)
# ========================================
script:
  - id: log_debug_state
    mode: queued
    parameters:
      context: string
      light_id: string
    then:
      - lambda: |-
          auto *light = App.get_light_by_key(fnv1_hash(light_id));
          if (light) {
            ESP_LOGD("debug", "[DEBUG %s] [%s] is_dimming: %s; dim_direction: %s; is_on: %s; brightness: %f",
              context.c_str(),
              light_id.c_str(),
              id(is_dimming)[light_id] ? "YES" : "NO",
              id(dim_direction)[light_id] ? "UP" : "DOWN",
              light->current_values.is_on() ? "YES" : "NO",
              light->current_values.get_brightness());
          }

  - id: ensure_min_brightness
    mode: queued
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = App.get_light_by_key(fnv1_hash(light_id));
          if (light && light->current_values.is_on() &&
              light->current_values.get_brightness() < ${MIN_BRIGHTNESS}) {
            auto call = light->turn_on();
            call.set_brightness(${MIN_BRIGHTNESS});
            call.perform();
          }

  - id: set_dim_direction_from_brightness
    mode: queued
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = App.get_light_by_key(fnv1_hash(light_id));
          if (light && light->current_values.is_on()) {
            id(dim_direction)[light_id] = light->current_values.get_brightness() > 0.5 ? false : true;
          }

# ========================================
# Outputs & Lights
# ========================================
output:
  - platform: ledc
    pin: 27
    frequency: ${PWM_FREQUENCY}
    id: LED_CHANNEL_1
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "${ESPHOME_NAME}-L1"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: 2.8
    id: LED_1
    output: LED_CHANNEL_1
    restore_mode: RESTORE_DEFAULT_OFF

# ========================================
# Sensors
# ========================================
sensor:
  - platform: uptime
    name: "${ESPHOME_NAME}_Uptime Sensor"
  - platform: internal_temperature
    name: "${ESPHOME_NAME} Internal Temp"
    unit_of_measurement: "°C"

switch:
  - platform: restart
    name: ${ESPHOME_NAME}-restart
    id: restart_switch

# ========================================
# Binary Sensors (Buttons)
# ========================================
binary_sensor:
  - platform: gpio
    pin: 36
    name: "Button 1"
    id: BUTTON_1
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    # Short press: Toggle light
    on_click:
      min_length: ${MIN_CLICK_DURATION}
      max_length: ${MAX_CLICK_DURATION}
      then:
        - light.toggle: LED_1
        - script.execute:
            id: log_debug_state
            context: "CLICK"
            light_id: LED_1
        - script.execute:
            id: ensure_min_brightness
            light_id: LED_1
        - script.execute:
            id: set_dim_direction_from_brightness
            light_id: LED_1

    # Long press: Start dimming
    on_press:
      then:
        - delay: ${MAX_CLICK_DURATION}
        - if:
            condition:
              - binary_sensor.is_on: BUTTON_1
              - light.is_on: LED_1
            then:
              - lambda: 'id(is_dimming)["LED_1"] = true;'
              - light.control:
                  id: LED_1
                  state: ON
                  brightness: !lambda 'return id(dim_direction)["LED_1"] ? 1.0 : ${MIN_BRIGHTNESS};'
                  transition_length: ${DEFAULT_DIM_DURATION}
              - script.execute:
                  id: log_debug_state
                  context: "PRESS"
                  light_id: LED_1

    # Release: Stop dimming and flip direction
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(is_dimming)["LED_1"];'
            then:
              - light.control:
                  id: LED_1
                  brightness: !lambda 'return id(LED_1).current_values.get_brightness();'
                  transition_length: ${IMMEDIATE_TRANSITION}
              - lambda: |-
                  id(dim_direction)["LED_1"] = !id(dim_direction)["LED_1"];
                  id(is_dimming)["LED_1"] = false;
        - script.execute:
            id: log_debug_state
            context: "RELEASE"
            light_id: LED_1
