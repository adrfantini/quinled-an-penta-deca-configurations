# Configuration for the QuinLED An-Penta-Deca, ground floor (P0).
# Shared logic and behaviour description: common/quinled.yaml
# Pinout: pinout.csv, summary: ground_floor_summary.csv

substitutions:
  ESPHOME_NAME: quinled-an-penta-deca-p0
  AP_SSID: "Test-An-Penta-Deca"
  AP_PASSWORD: !secret p0_ap_password
  API_KEY: !secret p0_api_key
  OTA_PASSWORD: !secret p0_ota_password

packages:
  common: !include common/quinled.yaml

esphome:
  on_boot:
    priority: -100  # Run after lights are restored
    then:
      - lambda: |-
          id(light_registry)["led_corridoio"] = id(led_corridoio);
          id(light_registry)["led_cucina"] = id(led_cucina);
          id(light_registry)["led_salotto"] = id(led_salotto);
          id(light_registry)["led_studio"] = id(led_studio);
          id(light_registry)["led_antibagno"] = id(led_antibagno);
          id(light_registry)["led_bagno"] = id(led_bagno);
          id(button_registry)["button_1"] = id(button_1);
          id(button_registry)["button_2"] = id(button_2);
          id(button_registry)["button_3"] = id(button_3);
          id(button_registry)["pcf8574_button_2"] = id(pcf8574_button_2);
          id(button_registry)["pcf8574_button_4"] = id(pcf8574_button_4);
          id(button_registry)["pcf8574_button_7"] = id(pcf8574_button_7);
      - script.execute: init_dim_directions

output:
  - platform: ledc
    id: LED_CHANNEL_1
    pin: 27
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_2
    pin: 26
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_3
    pin: 25
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_4
    pin: 23
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_6
    pin: 21
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_7
    pin: 19
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_8
    pin: 18
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_9
    pin: 17
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_11
    pin: 13
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_12
    pin: 12
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true

light:
  # LED_1 + LED_2 on GPIO27 + GPIO26 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED1_CORRIDOIO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_corridoio
    cold_white: LED_CHANNEL_1
    warm_white: LED_CHANNEL_2
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_corridoio

  # LED_3 + LED_4 on GPIO25 + GPIO23 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED2_CUCINA"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_cucina
    cold_white: LED_CHANNEL_3
    warm_white: LED_CHANNEL_4
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_cucina

  # LED_6 + LED_7 on GPIO21 + GPIO19 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED4_SALOTTO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_salotto
    cold_white: LED_CHANNEL_6
    warm_white: LED_CHANNEL_7
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_salotto

  # LED_8 + LED_9 on GPIO18 + GPIO17 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED5_STUDIO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_studio
    cold_white: LED_CHANNEL_8
    warm_white: LED_CHANNEL_9
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_studio

  # LED_11 on GPIO13 -> monochromatic light
  - platform: monochromatic
    name: "${ESPHOME_NAME}-LED6_BAGNO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_bagno
    output: LED_CHANNEL_11
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_bagno

  # LED_12 on GPIO12 -> monochromatic light
  - platform: monochromatic
    name: "${ESPHOME_NAME}-LED7_ANTIBAGNO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_antibagno
    output: LED_CHANNEL_12
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_antibagno

binary_sensor:

  # =========================
  # LED5_STUDIO - PCF8574 BUTTON 2
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 2
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P2"
    id: pcf8574_button_2
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_studio
            button_id: pcf8574_button_2

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_studio

  # =========================
  # LED6_BAGNO - PCF8574 BUTTON 4
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 4
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P4"
    id: pcf8574_button_4
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_bagno
            button_id: pcf8574_button_4

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_bagno

  # =========================
  # LED7_ANTIBAGNO - PCF8574 BUTTON 7
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 7
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P7"
    id: pcf8574_button_7
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_antibagno
            button_id: pcf8574_button_7

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_antibagno

  # =========================
  # LED1_CORRIDOIO - INTERNAL BUTTON 1
  # =========================
  - platform: gpio
    pin: 36
    name: "Button 1"
    id: button_1
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_corridoio
            button_id: button_1

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_corridoio

  # =========================
  # LED2_CUCINA - INTERNAL BUTTON 2
  # =========================
  - platform: gpio
    pin: 39
    name: "Button 2"
    id: button_2
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_cucina
            button_id: button_2

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_cucina

  # =========================
  # LED4_SALOTTO - INTERNAL BUTTON 3
  # =========================
  - platform: gpio
    pin: 34
    name: "Button 3"
    id: button_3
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_salotto
            button_id: button_3

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_salotto
