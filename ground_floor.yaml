# Configuration for the QuinLED An-Penta-Deca, ground floor (P0).
# Documentation:
# https://quinled.info/quinled-an-penta-deca-pinout-guide/
# https://esphome.io/components/light/
# Pinout: pinout.csv, summary: ground_floor_summary.csv
# Credentials come from secrets.yaml (template: secrets.yaml.example).
#
# Behaviour:
#   Short press (< MAX_CLICK_DURATION_MS): toggles the light. When turning on,
#   the previous brightness is restored, kept between MIN_BRIGHTNESS and the
#   Max Brightness slider.
#
#   Long press (>= MAX_CLICK_DURATION_MS, while the light is on): dims toward the
#   maximum or minimum at constant speed (a full sweep takes
#   DEFAULT_DIM_DURATION seconds). Release freezes the brightness and reverses
#   the direction for the next long press. A long press on a light that is
#   already at one end always moves away from that end.
#
#   Long press while the light is off: the light turns on when released.
#
#   Max Brightness (Night Mode): a slider exposed to Home Assistant caps the
#   brightness of every light, whatever the source of the change. Its value
#   survives reboots.
#
# Adding a new light + button:
#   1. Add an output, light and binary_sensor entry.
#   2. Register them in the on_boot lambda (light_registry / button_registry).
#   3. Light on_state -> clamp_brightness.
#   4. Button on_press -> start_dimming, on_release -> stop_dimming_or_toggle.

substitutions:
  ESPHOME_NAME: quinled-an-penta-deca-p0
  MIN_BRIGHTNESS: "12"          # Minimum brightness (%)
  DEFAULT_DIM_DURATION: "4"     # Full-range dimming duration (s); integer, used in lambdas
  DEFAULT_ONOFF_DURATION: 400ms # On/off transition
  IMMEDIATE_TRANSITION: "0"     # Immediate transition (ms); integer, used in lambdas
  MAX_CLICK_DURATION_MS: "400"  # Longer presses count as long presses (ms); integer, used in lambdas
  BUTTON_FILTER_DURATION: 50ms
  PWM_FREQUENCY: 19531Hz
  GAMMA_CORRECTION: "2.8"
  LOG_LEVEL: INFO               # NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE
  WW_COLOR_TEMPERATURE: 2700 K
  CW_COLOR_TEMPERATURE: 5500 K

esphome:
  name: ${ESPHOME_NAME}
  on_boot:
    priority: -100  # Run after lights are restored
    then:
      - lambda: |-
          id(light_registry)["led_corridoio"] = id(led_corridoio);
          id(light_registry)["led_cucina"] = id(led_cucina);
          id(light_registry)["led_salotto"] = id(led_salotto);
          id(light_registry)["led_studio"] = id(led_studio);
          id(light_registry)["led_antibagno"] = id(led_antibagno);
          id(light_registry)["led_bagno"] = id(led_bagno);
          id(button_registry)["button_1"] = id(button_1);
          id(button_registry)["button_2"] = id(button_2);
          id(button_registry)["button_3"] = id(button_3);
          id(button_registry)["pcf8574_button_2"] = id(pcf8574_button_2);
          id(button_registry)["pcf8574_button_4"] = id(pcf8574_button_4);
          id(button_registry)["pcf8574_button_7"] = id(pcf8574_button_7);
      - script.execute: init_dim_directions

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .domain.local
  ap:
    ssid: "Test-An-Penta-Deca"
    password: !secret p0_ap_password

captive_portal:

web_server:
  port: 80

api:
  # Reboots the device if the API connection is lost for 60 minutes. This
  # causes a very short light outage, but keeps the device reachable.
  reboot_timeout: 60min
  encryption:
    key: !secret p1_api_key

ota:
  - platform: esphome
    encryption:

logger:
  level: ${LOG_LEVEL}

i2c:
  sda: 15
  scl: 16
  scan: true

pcf8574:
  - id: pcf8574_hub
    address: 0x20

globals:
  - id: dim_direction
    type: std::map<std::string, bool>
    restore_value: false
    # Per-light dim direction: true = UP, false = DOWN
  - id: is_dimming
    type: std::map<std::string, bool>
    restore_value: false
  - id: press_time
    type: std::map<std::string, uint32_t>
    restore_value: false
    # Per-button time of the last press, so a pending long press check from
    # an earlier press is ignored after a quick release and press again
  - id: light_registry
    type: std::map<std::string, esphome::light::LightState *>
    restore_value: false
  - id: button_registry
    type: std::map<std::string, esphome::binary_sensor::BinarySensor *>
    restore_value: false

script:
  # Run from the floor's on_boot, after the registries are filled
  - id: init_dim_directions
    then:
      - delay: 1s  # Wait for light states to fully restore
      - lambda: |-
          for (auto &pair : id(light_registry)) {
            id(set_dim_direction_from_brightness).execute(pair.first);
          }
          ESP_LOGI("max_brightness", "Boot: max_brightness restored to %.0f%%", id(max_brightness).state);

  - id: set_dim_direction_from_brightness
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light && light->remote_values.is_on()) {
            float midpoint = (${MIN_BRIGHTNESS} / 100.0f + id(max_brightness).state / 100.0f) / 2.0f;
            id(dim_direction)[light_id] = light->remote_values.get_brightness() <= midpoint;
          } else {
            id(dim_direction)[light_id] = true;
          }

  - id: clamp_brightness
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (!light || !light->remote_values.is_on()) return;
          float brightness = light->remote_values.get_brightness();
          float minimum = ${MIN_BRIGHTNESS} / 100.0f;
          float maximum = id(max_brightness).state / 100.0f;
          float clamped = std::min(std::max(brightness, minimum), maximum);
          if (fabsf(brightness - clamped) > 0.001f) {
            // Default transition, so a turn-on above the cap still fades in
            auto call = light->turn_on();
            call.set_brightness(clamped);
            call.perform();
          }

  - id: toggle_light
    mode: parallel
    parameters:
      light_id: string
    then:
      - lambda: |-
          auto *light = id(light_registry)[light_id];
          if (light) light->toggle().perform();
      - script.execute:
          id: set_dim_direction_from_brightness
          light_id: !lambda 'return light_id;'

  - id: start_dimming
    mode: parallel
    parameters:
      light_id: string
      button_id: string
    then:
      - lambda: 'id(press_time)[button_id] = millis();'
      - delay: ${MAX_CLICK_DURATION_MS}ms
      - lambda: |-
          auto *button = id(button_registry)[button_id];
          auto *light = id(light_registry)[light_id];
          // A later press is still within its own click window
          if (millis() - id(press_time)[button_id] + 10 < ${MAX_CLICK_DURATION_MS}) return;
          if (!button || !button->state || !light || !light->remote_values.is_on() || id(is_dimming)[light_id]) return;
          id(is_dimming)[light_id] = true;
          float minimum = ${MIN_BRIGHTNESS} / 100.0f;
          float maximum = id(max_brightness).state / 100.0f;
          float current = light->remote_values.get_brightness();
          // Always move away from an end, even if the stored direction points at it
          if (current >= maximum - 0.01f) id(dim_direction)[light_id] = false;
          else if (current <= minimum + 0.01f) id(dim_direction)[light_id] = true;
          float target = id(dim_direction)[light_id] ? maximum : minimum;
          float range = maximum - minimum;
          uint32_t transition_ms = range > 0.0f
              ? (uint32_t)(${DEFAULT_DIM_DURATION} * 1000.0f * fabsf(target - current) / range)
              : 0;
          auto call = light->turn_on();
          call.set_brightness(target);
          call.set_transition_length(transition_ms);
          call.perform();

  - id: stop_dimming_or_toggle
    mode: parallel
    parameters:
      light_id: string
    then:
      - if:
          condition:
            lambda: 'return id(is_dimming)[light_id];'
          then:
            - lambda: |-
                auto *light = id(light_registry)[light_id];
                if (light) {
                  auto call = light->turn_on();
                  call.set_brightness(light->current_values.get_brightness());
                  call.set_transition_length(${IMMEDIATE_TRANSITION});
                  call.perform();
                  id(dim_direction)[light_id] = !id(dim_direction)[light_id];
                }
                id(is_dimming)[light_id] = false;
          else:
            - script.execute:
                id: toggle_light
                light_id: !lambda 'return light_id;'

output:
  - platform: ledc
    id: LED_CHANNEL_1
    pin: 27
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_2
    pin: 26
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_3
    pin: 25
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_4
    pin: 23
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_6
    pin: 21
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_7
    pin: 19
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_8
    pin: 18
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_9
    pin: 17
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_11
    pin: 13
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_12
    pin: 12
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true

light:
  # LED_1 + LED_2 on GPIO27 + GPIO26 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED1_CORRIDOIO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_corridoio
    cold_white: LED_CHANNEL_1
    warm_white: LED_CHANNEL_2
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_corridoio

  # LED_3 + LED_4 on GPIO25 + GPIO23 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED2_CUCINA"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_cucina
    cold_white: LED_CHANNEL_3
    warm_white: LED_CHANNEL_4
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_cucina

  # LED_6 + LED_7 on GPIO21 + GPIO19 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED4_SALOTTO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_salotto
    cold_white: LED_CHANNEL_6
    warm_white: LED_CHANNEL_7
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_salotto

  # LED_8 + LED_9 on GPIO18 + GPIO17 -> CCT light
  - platform: cwww
    name: "${ESPHOME_NAME}-LED5_STUDIO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_studio
    cold_white: LED_CHANNEL_8
    warm_white: LED_CHANNEL_9
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_studio

  # LED_11 on GPIO13 -> monochromatic light
  - platform: monochromatic
    name: "${ESPHOME_NAME}-LED6_BAGNO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_bagno
    output: LED_CHANNEL_11
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_bagno

  # LED_12 on GPIO12 -> monochromatic light
  - platform: monochromatic
    name: "${ESPHOME_NAME}-LED7_ANTIBAGNO"
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    gamma_correct: ${GAMMA_CORRECTION}
    id: led_antibagno
    output: LED_CHANNEL_12
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led_antibagno

binary_sensor:

  # =========================
  # LED5_STUDIO - PCF8574 BUTTON 2
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 2
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P2"
    id: pcf8574_button_2
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_studio
            button_id: pcf8574_button_2

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_studio

  # =========================
  # LED6_BAGNO - PCF8574 BUTTON 4
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 4
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P4"
    id: pcf8574_button_4
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_bagno
            button_id: pcf8574_button_4

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_bagno

  # =========================
  # LED7_ANTIBAGNO - PCF8574 BUTTON 7
  # =========================
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 7
      mode:
        input: true
      inverted: true
    name: "PCF8574 Button P7"
    id: pcf8574_button_7
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_antibagno
            button_id: pcf8574_button_7

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_antibagno

  # =========================
  # LED1_CORRIDOIO - INTERNAL BUTTON 1
  # =========================
  - platform: gpio
    pin: 36
    name: "Button 1"
    id: button_1
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_corridoio
            button_id: button_1

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_corridoio

  # =========================
  # LED2_CUCINA - INTERNAL BUTTON 2
  # =========================
  - platform: gpio
    pin: 39
    name: "Button 2"
    id: button_2
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_cucina
            button_id: button_2

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_cucina

  # =========================
  # LED4_SALOTTO - INTERNAL BUTTON 3
  # =========================
  - platform: gpio
    pin: 34
    name: "Button 3"
    id: button_3
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}

    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led_salotto
            button_id: button_3

    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led_salotto

number:
  - platform: template
    name: "${ESPHOME_NAME} Max Brightness"
    id: max_brightness
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    min_value: ${MIN_BRIGHTNESS}
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          ESP_LOGI("max_brightness", "Max brightness changed to %.0f%%", x);
          float maximum = x / 100.0f;
          for (auto &pair : id(light_registry)) {
            auto *light = pair.second;
            if (light && light->remote_values.is_on() &&
                light->remote_values.get_brightness() > maximum) {
              auto call = light->turn_on();
              call.set_brightness(maximum);
              call.set_transition_length(${IMMEDIATE_TRANSITION});
              call.perform();
            }
          }

sensor:
  - platform: uptime
    name: "${ESPHOME_NAME} Uptime"
  - platform: internal_temperature
    name: "${ESPHOME_NAME} Internal Temperature"
    unit_of_measurement: "°C"
  - platform: wifi_signal
    name: "${ESPHOME_NAME} WiFi Signal"
    update_interval: 60s

switch:
  - platform: restart
    name: "${ESPHOME_NAME} Restart"
    id: restart_switch
