# Configuration for the QuinLED An-Penta-Deca, first floor (P1).
# Shared logic and behaviour description: common.yaml
# Pinout: pinout.csv, summary: first_floor_summary.csv

substitutions:
  ESPHOME_NAME: quinled-an-penta-deca-p1
  AP_SSID: "Test-An-Penta-Deca-P1"
  AP_PASSWORD: !secret p1_ap_password
  API_KEY: !secret p1_api_key
  OTA_PASSWORD: !secret p1_ota_password

packages:
  common: !include common.yaml

esphome:
  on_boot:
    priority: -100  # Run after lights are restored
    then:
      - lambda: |-
          id(light_registry)["led5_matrimoniale"] = id(led5_matrimoniale);
          id(light_registry)["led2_studio"] = id(led2_studio);
          id(light_registry)["led3_cameretta_armadio"] = id(led3_cameretta_armadio);
          id(light_registry)["led4_cameretta_luce"] = id(led4_cameretta_luce);
          id(light_registry)["led6_cameretta_soppalco"] = id(led6_cameretta_soppalco);
          id(light_registry)["led1_corridoio"] = id(led1_corridoio);
          id(light_registry)["led7_scale"] = id(led7_scale);
          id(button_registry)["external_button_1"] = id(external_button_1);
          id(button_registry)["external_button_3"] = id(external_button_3);
          id(button_registry)["external_button_5"] = id(external_button_5);
          id(button_registry)["external_button_7"] = id(external_button_7);
          id(button_registry)["button_1"] = id(button_1);
          id(button_registry)["button_2"] = id(button_2);
          id(button_registry)["button_3"] = id(button_3);
      - script.execute: init_dim_directions

output:
  - platform: ledc
    id: LED_CHANNEL_1
    pin: 27
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_3
    pin: 25
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_4
    pin: 23
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_6
    pin: 21
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_7
    pin: 19
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_8
    pin: 18
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_9
    pin: 17
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_10
    pin: 14
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_14
    pin: 4
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true
  - platform: ledc
    id: LED_CHANNEL_15
    pin:
      number: 2
      ignore_strapping_warning: true  # Only relevant for serial flashing; pulled low at boot
    frequency: ${PWM_FREQUENCY}
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "${ESPHOME_NAME}-led5_matrimoniale"
    id: led5_matrimoniale
    output: LED_CHANNEL_1
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led5_matrimoniale

  - platform: cwww
    name: "${ESPHOME_NAME}-led2_studio"
    id: led2_studio
    cold_white: LED_CHANNEL_3
    warm_white: LED_CHANNEL_4
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led2_studio

  - platform: monochromatic
    name: "${ESPHOME_NAME}-led3_cameretta_armadio"
    id: led3_cameretta_armadio
    output: LED_CHANNEL_6
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led3_cameretta_armadio

  - platform: monochromatic
    name: "${ESPHOME_NAME}-led4_cameretta_luce"
    id: led4_cameretta_luce
    output: LED_CHANNEL_7
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led4_cameretta_luce

  - platform: monochromatic
    name: "${ESPHOME_NAME}-led6_cameretta_soppalco"
    id: led6_cameretta_soppalco
    output: LED_CHANNEL_8
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led6_cameretta_soppalco

  - platform: cwww
    name: "${ESPHOME_NAME}-led1_corridoio"
    id: led1_corridoio
    cold_white: LED_CHANNEL_14
    warm_white: LED_CHANNEL_15
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led1_corridoio

  - platform: cwww
    name: "${ESPHOME_NAME}-led7_scale"
    id: led7_scale
    cold_white: LED_CHANNEL_9
    warm_white: LED_CHANNEL_10
    cold_white_color_temperature: ${CW_COLOR_TEMPERATURE}
    warm_white_color_temperature: ${WW_COLOR_TEMPERATURE}
    gamma_correct: ${GAMMA_CORRECTION}
    default_transition_length: ${DEFAULT_ONOFF_DURATION}
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      then:
        - script.execute:
            id: clamp_brightness
            light_id: led7_scale

binary_sensor:
  # External controls use the PCF8574 port numbers directly.
  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 1
      mode:
        input: true
      inverted: true
    name: "P1 External Button 1"
    id: external_button_1
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led5_matrimoniale
            button_id: external_button_1
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led5_matrimoniale

  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 3
      mode:
        input: true
      inverted: true
    name: "P1 External Button 3"
    id: external_button_3
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led2_studio
            button_id: external_button_3
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led2_studio

  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 5
      mode:
        input: true
      inverted: true
    name: "P1 External Button 5"
    id: external_button_5
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led1_corridoio
            button_id: external_button_5
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led1_corridoio

  - platform: gpio
    pin:
      pcf8574: pcf8574_hub
      number: 7
      mode:
        input: true
      inverted: true
    name: "P1 External Button 7"
    id: external_button_7
    filters:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led7_scale
            button_id: external_button_7
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led7_scale

  - platform: gpio
    pin: 36
    name: "P1 Button 1"
    id: button_1
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led3_cameretta_armadio
            button_id: button_1
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led3_cameretta_armadio

  - platform: gpio
    pin: 39
    name: "P1 Button 2"
    id: button_2
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led4_cameretta_luce
            button_id: button_2
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led4_cameretta_luce

  - platform: gpio
    pin: 34
    name: "P1 Button 3"
    id: button_3
    filters:
      - invert:
      - delayed_on_off: ${BUTTON_FILTER_DURATION}
    on_press:
      then:
        - script.execute:
            id: start_dimming
            light_id: led6_cameretta_soppalco
            button_id: button_3
    on_release:
      then:
        - script.execute:
            id: stop_dimming_or_toggle
            light_id: led6_cameretta_soppalco
